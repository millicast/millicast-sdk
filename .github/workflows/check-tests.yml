name: Check tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the dependencies 🧱
        run: |
          corepack enable
          pnpm ci
      - name: Check Linter and Build 📑
        run: |
          pnpm run build
          npx eslint . --ext .js,.jsx,.ts,.tsx

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the dependencies 🧱
        run: |
          corepack enable
          PUPPETEER_SKIP_DOWNLOAD=true pnpm ci
      - name: Install Puppeteer browsers
        working-directory: './packages/millicast-sdk'
        run: npx puppeteer browsers install chrome
      - name: Unit Testing 🧪
        working-directory: './packages/millicast-sdk'
        run: pnpm run test-unit

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the dependencies 🧱
        run: |
          corepack enable
          PUPPETEER_SKIP_DOWNLOAD=true pnpm ci
      - name: Install Puppeteer browsers
        working-directory: './packages/millicast-sdk'
        run: npx puppeteer browsers install chrome
      - name: End-2-End Testing
        working-directory: './packages/millicast-sdk'
        run: pnpm run test-e2e
        env:
          ACCOUNT_ID: ${{vars.PUBLISHER_DEMO_ACC_ID}}
          PUBLISH_TOKEN: ${{secrets.PUBLISHER_DEMO_TOKEN}}

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the dependencies 🧱
        run: |
          corepack enable
          pnpm ci
      - name: build docs
        run: pnpm run build-docs
