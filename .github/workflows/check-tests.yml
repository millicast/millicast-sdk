name: Check tests

on:
  workflow_dispatch:
  push:
    tags:
      - '**'
    branches:
      - '**'

defaults:
  run:
    shell: bash

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - name: Install the dependencies 🧱
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm ci

      - name: Check Linter and Build 📑
        run: |
          pnpm run build
          pnpm exec eslint .

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - name: Install the dependencies 🧱
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm ci

      - name: Install Chromium
        run: |
          sudo apt-get update -qq -y
          sudo apt-get install -qq -y chromium-browser
          echo "PUPPETEER_EXECUTABLE_PATH=$(which chromium-browser)" >> "${GITHUB_ENV}"

      - name: Unit Testing 🧪
        run: pnpm --filter @millicast/sdk run test-unit

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - name: Install the dependencies 🧱
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm ci

      - name: Install Chromium
        run: |
          sudo apt-get update -qq -y
          sudo apt-get install -qq -y chromium-browser
          echo "PUPPETEER_EXECUTABLE_PATH=$(which chromium-browser)" >> "${GITHUB_ENV}"

      - name: End-to-End Testing
        env:
          ACCOUNT_ID: ${{ secrets.PUBLISHER_DEMO_ACC_ID }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISHER_DEMO_TOKEN }}
        run: pnpm --filter @millicast/sdk run test-e2e

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - name: Install the dependencies 🧱
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          pnpm ci

      - name: build docs
        run: pnpm --filter @millicast/sdk run build-docs
