name: Check tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Derive appropriate SHAs for base and head for affected commands
        uses: nrwl/nx-set-shas@v4


      - name: Setup Node.js & Cache 🧱
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'


      - name: Install dependencies
        run: npm ci


      - name: Lint SDK Only
        run: npx nx lint @millicast/sdk


      - name: Build affected projects
        run: npx nx affected -t build --parallel=3
        timeout-minutes: 10

      - name: Build documentation
        run: npx nx affected -t build-docs
        timeout-minutes: 5


      - name: Cache dependencies and build artifacts
        uses: actions/cache/save@v3
        with:
          path: |
            node_modules
            dist
            .nx/cache
          key: ${{ runner.os }}-build-${{ github.sha }}

  unit-tests:
    needs: install-and-build
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Derive appropriate SHAs
        uses: nrwl/nx-set-shas@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Restore dependencies and build artifacts
        uses: actions/cache/restore@v3
        with:
          path: |
            node_modules
            dist
            .nx/cache
          key: ${{ runner.os }}-build-${{ github.sha }}


      - name: Run Unit Tests
        run: npm run test-unit

  e2e-tests:
    needs: install-and-build
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Derive appropriate SHAs
        uses: nrwl/nx-set-shas@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Restore dependencies and build artifacts
        uses: actions/cache/restore@v3
        with:
          path: |
            node_modules
            dist
            .nx/cache
          key: ${{ runner.os }}-build-${{ github.sha }}


      - name: Run E2E Tests
        run: npm run test-e2e
        env:
          ACCOUNT_ID: ${{ vars.PUBLISHER_DEMO_ACC_ID }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISHER_DEMO_TOKEN }}
