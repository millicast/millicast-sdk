name: Check tests

on:
  
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Derive appropriate SHAs for base and head for affected commands
        uses: nrwl/nx-set-shas@v4


      - name: Setup Node.js & Cache 🧱
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'


      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit


      - name: Lint SDK Only
        run: npx nx lint @millicast/sdk


      - name: Build affected projects
        run: npx nx affected -t build --parallel=3
        timeout-minutes: 10

      - name: Build documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx nx affected -t build-docs
        timeout-minutes: 5


      - name: Cache dependencies and build artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            dist
            .nx/cache
          key: ${{ runner.os }}-build-${{ github.sha }}

  unit-tests:
    needs: install-and-build
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Derive appropriate SHAs
        uses: nrwl/nx-set-shas@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Restore dependencies and build artifacts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            dist
            .nx/cache
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-


      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit


      - name: Run Unit Tests
        run: npm run test-unit
        timeout-minutes: 10

  e2e-tests:
    needs: install-and-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-file: 

          - 'FunctionalPublish.steps.js'
          - 'Puppeteer.steps.js'
          - 'AbrStrategies.steps.js'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Derive appropriate SHAs
        uses: nrwl/nx-set-shas@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Restore dependencies and build artifacts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            dist
            .nx/cache
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Cache Puppeteer Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: Install Puppeteer Chrome
        run: npx -y puppeteer browsers install chrome
      - name: Run E2E Tests
        run: npm run test-e2e -- --testPathPattern=${{ matrix.test-file }}
        timeout-minutes: 10
        env:
          ACCOUNT_ID: ${{ vars.PUBLISHER_DEMO_ACC_ID }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISHER_DEMO_TOKEN }}
