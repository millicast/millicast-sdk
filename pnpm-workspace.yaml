minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@dolbyio/*'
trustPolicy: no-downgrade
engineStrict: true

packages:
  - 'packages/*'

overrides:
  'jest-environment-puppeteer>jest-environment-node': '^30.4.1'
  'glob@10': '^12.0.0'
  'uuid@<11.1.1': '^11.1.1'

peerDependencyRules:
  allowedVersions:
    '@babel/core': '8'

allowBuilds:
  esbuild: true
  core-js: true
  unrs-resolver: true
  puppeteer: true

trustPolicyExclude:
  - 'semver@6.3.1'
  - 'ua-parser-js@1.0.41'
