minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
engineStrict: true

packages:
  - 'packages/*'

overrides:
  'jest-environment-puppeteer>jest-environment-node': '^30.4.1'
  'axios@1': '^1.20.0'
  'brace-expansion@1': '^1.1.18'
  'ip-address@9': '^10.5.0'
  'js-yaml@3': '^3.15.1'
  'linkify-it@5': '^5.0.2'
  'diff@4': '^4.0.4'
  'flatted@3': '^3.4.2'
  'glob@10': '^12.0.0'
  'joi@17': '^17.13.4'
  'js-yaml@4': '^4.3.1'
  'lodash@4': '^4.18.1'
  'markdown-it@14': '^14.2.0'
  'minimatch@3': '^3.1.4'
  'picomatch@2': '^2.3.2'
  'underscore@1': '^1.13.8'
  'uuid@<11.1.1': '^11.1.1'
  'ws@8': '^8.21.0'

allowBuilds:
  esbuild: true
  core-js: true
  unrs-resolver: true
  puppeteer: true

trustPolicyExclude:
  - 'semver@6.3.1'
  - 'undici-types@6.19.8'
