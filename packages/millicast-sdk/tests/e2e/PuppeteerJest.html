<html>

<head>
   <title>PuppeteerJest</title>
   <script src="../../dist/millicast.umd.js"></script>
   <script>
      window.pubStatsCount=0;
      window.viewStatsCount=0;
      window.lastReceivedMetadata=null;

      const startPublisher=async (publishToken, streamName, options) => {
         const millicast=window.millicast;
         millicast.Logger.setLevel(millicast.Logger.DEBUG);
         const tokenGenerator=() => millicast.Director.getPublisher(publishToken, streamName);
         const publish=new millicast.Publish(undefined, tokenGenerator);

         publish.on('stats', () => {window.pubStatsCount++;});

         const mediaStream=await navigator.mediaDevices.getUserMedia({audio: true, video: true});
         document.getElementById('my-video').srcObject=mediaStream;

         await publish.connect({...options, mediaStream});
         window.publish=publish;
      }

      const startViewer=(streamName, accountId) => {
         return new Promise(resolve => {
            const millicast=window.millicast;
            const video=document.getElementById('my-video');
            const tokenGenerator=() => millicast.Director.getSubscriber({
               streamName: streamName,
               streamAccountId: accountId
            });
            const view=new millicast.View(undefined, tokenGenerator);

            view.on('stats', () => {window.viewStatsCount++;});
            view.on('metadata', (data) => {window.lastReceivedMetadata=data;});

            video.addEventListener('timeupdate', () => {
               if (video.currentTime>1) resolve();
            });
            view.on('track', (event) => {video.srcObject=event.streams[0];});
            view.connect({metadata: true});
            window.view=view;
         })
      }

      const getVideoPixelSums=() => {
         const canvas=document.createElement('canvas');
         const id=document.getElementById('my-video');
         const ctx=canvas.getContext('2d');
         ctx.drawImage(id, 0, 0, 640, 480);
         const imageData=ctx.getImageData(0, 0, 640, 480).data;
         return imageData.reduce((total, current) => total+current, 0);
      }
   </script>
</head>

<body>
   <video id='my-video' muted autoplay controls width='640' height='480'></video>
</body>

</html>
