<!DOCTYPE html>
<html>

<head>
   <title>Millicast SDK E2E Tests</title>
</head>

<body>
   <div id="test-container">
      <h1>Millicast SDK E2E Test Page</h1>
      <div id="status">Loading...</div>
   </div>

   <script type="module">
      console.log('Module script starting...');

      // Initialize SDK ready flag
      window.sdkReady=false;

      try {
         // Import the SDK using dynamic import with proper path
         const millicast=await import('../../dist/millicast.umd.js');
         console.log('SDK imported successfully:', Object.keys(millicast));

         // Make it globally available
         window.millicast=millicast;

         // Set SDK ready flag
         window.sdkReady=true;

         // Update status
         const statusElement=document.getElementById('status');
         if (statusElement) {
            statusElement.textContent='SDK Ready';
         }

         console.log('Millicast SDK loaded successfully');

      } catch (error) {
         console.error('Error importing SDK:', error);

         window.sdkReady=false;
         window.sdkError=error;

         const statusElement=document.getElementById('status');
         if (statusElement) {
            statusElement.textContent='SDK Load Failed: '+error.message;
         }
      }
   </script>

   <script>
      // Helper functions for tests (Keep these outside the module)
      async function startPublisher() {
         console.log('startPublisher called from HTML');
         // Implementation here
      }

      // Global error handler
      window.addEventListener('error', (event) => {
         console.error('Global error:', event.error);
         window.globalError=event.error;
      });

      // Unhandled promise rejection handler
      window.addEventListener('unhandledrejection', (event) => {
         console.error('Unhandled promise rejection:', event.reason);
         window.rejectionError=event.reason;
      });

      // Initialize flags
      window.sdkReady=false;
   </script>
</body>

</html>
