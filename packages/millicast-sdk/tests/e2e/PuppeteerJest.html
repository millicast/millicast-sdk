<!DOCTYPE html>
<html>

<head>
   <meta charset="utf-8">
   <title>Millicast SDK E2E Tests</title>
   <script src="../../dist/millicast.umd.js"></script>
</head>

<body>
   <div id="test-container">
      <h1>Millicast SDK E2E Test Page</h1>
      <div id="status">Loading...</div>
   </div>

   <script>
      console.log('Test page loading...');

      // Initialize when page loads
      window.addEventListener('load', () => {
         console.log('Page loaded, checking SDK...');

         // Check if SDK loaded
         if (window.millicast) {
            console.log('Millicast SDK loaded successfully');
            console.log('Available SDK methods:', Object.keys(window.millicast));

            // Try to initialize logger
            if (window.millicast.Logger) {
               try {
                  window.logger=window.millicast.Logger;
                  console.log('Logger initialized');
               } catch (e) {
                  console.warn('Logger initialization failed:', e);
               }
            }

            // Set ready flag
            window.sdkReady=true;
            document.getElementById('status').textContent='SDK Ready';

         } else {
            console.error('Millicast SDK failed to load');
            document.getElementById('status').textContent='SDK Load Failed';
            window.sdkReady=false;
         }
      });

      // Helper function for tests
      async function startPublisher() {
         console.log('startPublisher called from HTML');

         // Wait for SDK to be ready
         let attempts=0;
         while (!window.sdkReady&&attempts<50) {
            await new Promise(resolve => setTimeout(resolve, 100));
            attempts++;
         }

         if (!window.sdkReady) {
            throw new Error('SDK not ready after waiting');
         }

         console.log('SDK is ready, publisher can start');
         return true;
      }

      // Global error handler
      window.addEventListener('error', (event) => {
         console.error('Global error:', event.error);
      });

      // Unhandled promise rejection handler
      window.addEventListener('unhandledrejection', (event) => {
         console.error('Unhandled promise rejection:', event.reason);
      });
   </script>
</body>

</html>
